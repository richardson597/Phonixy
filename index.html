<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Phone Simulator</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #0f172a;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: #fff;
        }

        /* Smartphone Frame Container */
        .phone-container {
            width: 320px;
            height: 600px;
            background-color: #000;
            border: 12px solid #334155;
            border-radius: 36px;
            position: relative;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        /* Screen Header / Status Bar */
        .status-bar {
            height: 30px;
            background-color: #1e293b;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 20px;
            font-size: 12px;
            color: #94a3b8;
        }

        /* Main Screen Body */
        .screen {
            flex: 1;
            background: linear-gradient(135deg, #1e1b4b, #311042);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            text-align: center;
        }

        .welcome-msg {
            font-size: 24px;
            margin-bottom: 10px;
            font-weight: 600;
            letter-spacing: 0.5px;
        }

        .sub-text {
            font-size: 14px;
            color: #cbd5e1;
            margin-bottom: 30px;
        }

        /* Interactive Element */
        .action-btn {
            background-color: #6366f1;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 20px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
            box-shadow: 0 4px 12px rgba(99, 102, 241, 0.4);
        }

        .action-btn:active {
            background-color: #4f46e5;
            transform: scale(0.98);
        }

        /* Screen Footer Navigation Bar */
        .nav-bar {
            height: 40px;
            background-color: #1e293b;
            display: flex;
            justify-content: space-around;
            align-items: center;
        }

        .nav-button {
            width: 16px;
            height: 16px;
            border: 2px solid #94a3b8;
            border-radius: 4px;
        }

        .nav-button.circle {
            border-radius: 50%;
        }

        .nav-button.triangle {
            width: 0;
            height: 0;
            border-left: 8px solid transparent;
            border-right: 8px solid transparent;
            border-bottom: 14px solid #94a3b8;
            border-top: none;
            background: transparent;
        }
    </style>
</head>
<body>

    <div class="phone-container">
        <div class="status-bar">
            <span>10:45</span>
            <span>LTE+ 🔋 85%</span>
        </div>

        <div class="screen">
            <div class="welcome-msg">Hello World!</div>
            <div class="sub-text">Your GitHub web application simulator is fully functional.</div>
            <button class="action-btn" onclick="greet()">Tap Screen</button>
        </div>

        <div class="nav-bar">
            <div class="nav-button triangle"></div>
            <div class="nav-button circle"></div>
            <div class="nav-button"></div>
        </div>
    </div>

    <script>
        function greet() {
            alert("Awesome! The interactive application link is working perfectly.");
        }
    </script>

</body>
</html>
